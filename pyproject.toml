[project]
name = "dtn-medical-mesh"
version = "0.1.0"
description = "Delay-tolerant mesh network for offline clinical data transport"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["node", "endpoint", "interface", "simulation"]

[tool.pytest.ini_options]
testpaths = ["validation"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"
