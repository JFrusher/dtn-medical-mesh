name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run mypy .
      - run: uv run pytest -q

  stress:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --locked
      # exits non-zero on any invariant violation (silent loss, false ACK, broken ledger)
      - run: uv run python -m simulation.runner stress --seed ${{ matrix.seed }} --quiet --out out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stress-report-seed-${{ matrix.seed }}
          path: out/
