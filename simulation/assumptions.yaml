# Every physical and compute parameter the emulator uses (spec §12.2).
# source: published (a datasheet, standard or paper: see ref), estimate (our guess, to be
# replaced), or measured (an H1 bench measurement). Scenarios may override radio values; the
# run report lists every value used and marks overrides.
radio:
  wifi_tx_dbm: {value: 17, unit: dBm, source: published, ref: "CYW43438 (Pi Zero 2 W) datasheet, 802.11n output power, typical"}
  wifi_antenna_dbi: {value: 0, unit: dBi, source: estimate, ref: "on-board PCB antenna, each end"}
  wifi_pl1m_db: {value: 40.2, unit: dB, source: published, ref: "free-space loss at 1 m, 2.437 GHz (Friis)"}
  wifi_ple: {value: 3.0, unit: "", source: published, ref: "log-distance path-loss exponent, urban outdoor 2.7-3.5 (Rappaport, Wireless Communications, table 4.2); mid value"}
  wifi_shadow_sigma_db: {value: 6, unit: dB, source: published, ref: "log-normal shadowing, 4-8 dB outdoor (Rappaport 4.9.2); drawn once per contact"}
  wifi_goodput_fraction: {value: 0.5, unit: of PHY rate, source: estimate, ref: "MAC, TCP and TLS overhead"}
  wifi_max_bytes_per_s: {value: 2500000, unit: B/s, source: estimate, ref: "Pi Zero 2 W CPU and SDIO ceiling (~20 Mbit/s)"}
  wifi_cs_range_m: {value: 200, unit: m, source: estimate, ref: "carrier-sense neighbourhood: contacts this close share one channel's airtime"}
  ble_adv_interval_s: {value: 0.2, unit: s, source: estimate, ref: "BLE advertising interval; Bluetooth Core spec allows 20 ms-10.24 s"}
  ble_scan_duty: {value: 0.25, unit: "", source: estimate, ref: "scan window / scan interval; chance each advertisement is heard"}
  wifi_join_s: {value: 1.5, unit: s, source: estimate, ref: "Wi-Fi Direct join, key exchange and first frame after BLE discovery"}
  lora_tx_dbm: {value: 14, unit: dBm, source: published, ref: "ETSI EN 300 220 25 mW ERP limit at 868 MHz; set per region"}
  lora_antenna_dbi: {value: 2, unit: dBi, source: estimate, ref: "external whip, each end"}
  lora_pl1m_db: {value: 31.2, unit: dB, source: published, ref: "free-space loss at 1 m, 868.1 MHz (Friis)"}
  lora_ple: {value: 3.5, unit: "", source: estimate, ref: "urban LoRa measurements report 2.3-4.0 (e.g. Petajajarvi et al. 2015); gives ~2 km at SF9"}
  lora_shadow_sigma_db: {value: 8, unit: dB, source: estimate, ref: "drawn per frame and receiver"}
  lora_sf: {value: 9, unit: "", source: estimate, ref: "spreading factor chosen for range vs airtime"}
  lora_bw_hz: {value: 125000, unit: Hz, source: published, ref: "LoRaWAN default bandwidth"}
  lora_cr: {value: 1, unit: "", source: published, ref: "coding rate 4/5"}
  lora_duty_cycle: {value: 0.01, unit: "", source: published, ref: "ETSI EN 300 220 g1 sub-band 1 %; set per region"}
  p_good_to_bad: {value: 0.0, unit: per frame, source: estimate, ref: "Gilbert-Elliott burst loss, off unless a scenario sets it"}
  p_bad_to_good: {value: 0.3, unit: per frame, source: estimate, ref: "Gilbert-Elliott"}
  loss_in_good: {value: 0.0, unit: per frame, source: estimate, ref: "Gilbert-Elliott"}
  loss_in_bad: {value: 0.5, unit: per frame, source: estimate, ref: "Gilbert-Elliott"}
  bit_flip_per_frame: {value: 0.0, unit: per frame, source: estimate, ref: "residual corruption past the link CRC, off unless a scenario sets it"}
  antenna_hub_m: {value: 8, unit: m, source: estimate, ref: "mast on the hospital roof"}
  antenna_site_m: {value: 4, unit: m, source: estimate, ref: "clinic wall or roof edge"}
  antenna_relay_m: {value: 6, unit: m, source: estimate, ref: "street-light pole"}
  antenna_mule_m: {value: 2, unit: m, source: estimate, ref: "vehicle roof or rear shelf"}
  clutter_db_per_100m: {value: 20, unit: dB per 100 m fully built, source: estimate, ref: "scaled by OSM building share along the path; ITU-R P.2108 gives statistics, not per-path values"}
compute:
  se_sign_s: {value: 0.05, unit: s, source: estimate, ref: "ATECC608B ECDSA P-256 sign, order of 50 ms per Microchip datasheet execution times; confirm in H1"}
  verify_s_zero2w: {value: 0.0012, unit: s, source: estimate, ref: "OpenSSL P-256 verify on Cortex-A53 at 1 GHz (Pi Zero 2 W), roughly 800/s"}
  verify_s_pi5: {value: 0.0002, unit: s, source: estimate, ref: "OpenSSL P-256 verify on Cortex-A76 at 2.4 GHz (Pi 5), roughly 5000/s"}
  sha256_bytes_per_s_zero2w: {value: 60000000, unit: B/s, source: estimate, ref: "BCM2710A1 has no ARMv8 crypto extensions: software SHA-256"}
  sha256_bytes_per_s_pi5: {value: 1500000000, unit: B/s, source: estimate, ref: "BCM2712 with ARMv8 SHA-256 instructions"}
  db_commit_s_zero2w: {value: 0.008, unit: s, source: estimate, ref: "SQLCipher WAL commit with synchronous=FULL: one fsync on industrial microSD"}
  db_commit_s_pi5: {value: 0.001, unit: s, source: estimate, ref: "same on NVMe SSD"}
  db_bytes_per_s_zero2w: {value: 8000000, unit: B/s, source: estimate, ref: "microSD write plus SQLCipher AES-256 on A53"}
  db_bytes_per_s_pi5: {value: 200000000, unit: B/s, source: estimate, ref: "NVMe write plus AES on A76"}
storage:
  page_bytes: {value: 4096, unit: B, source: published, ref: "SQLite default page size: each commit writes at least one page"}
  wal_factor: {value: 2, unit: x, source: published, ref: "SQLite WAL: pages are written to the WAL, then again at checkpoint"}
  endurance_tbw_sd: {value: 30, unit: TB written, source: estimate, ref: "industrial 32 GB microSD (pSLC/3D TLC); check the chosen card's datasheet"}
  endurance_tbw_nvme: {value: 150, unit: TB written, source: estimate, ref: "typical rating for a 256 GB NVMe SSD"}
power:
  idle_w_zero2w: {value: 0.7, unit: W, source: estimate, ref: "spec §11.2: Pi Zero 2 W node idle with radios listening"}
  active_w_zero2w: {value: 2.0, unit: W, source: estimate, ref: "spec §11.2: Pi Zero 2 W node transferring over Wi-Fi"}
  idle_w_pi5: {value: 3.0, unit: W, source: estimate, ref: "spec §11.2: Pi 5 hub idle"}
  active_w_pi5: {value: 7.0, unit: W, source: estimate, ref: "spec §11.2: Pi 5 hub transferring"}
  vehicle_charge_w: {value: 10, unit: W, source: estimate, ref: "vehicle supply via automotive DC-DC while the engine runs"}
  solar_derate: {value: 0.75, unit: of rated, source: estimate, ref: "charge controller, heat, dust and battery round-trip losses"}
  ghi_jan: {value: 6.31, unit: kWh/m2/day, source: published, ref: "NASA POWER climatology ALLSKY_SFC_SW_DWN at -3.37, 36.69 (Arusha), fetched 2026-11-08"}
  ghi_feb: {value: 6.51, unit: kWh/m2/day, source: published, ref: "NASA POWER, as ghi_jan"}
  ghi_mar: {value: 6.15, unit: kWh/m2/day, source: published, ref: "NASA POWER, as ghi_jan"}
  ghi_apr: {value: 5.25, unit: kWh/m2/day, source: published, ref: "NASA POWER, as ghi_jan"}
  ghi_may: {value: 4.62, unit: kWh/m2/day, source: published, ref: "NASA POWER, as ghi_jan"}
  ghi_jun: {value: 4.43, unit: kWh/m2/day, source: published, ref: "NASA POWER, as ghi_jan"}
  ghi_jul: {value: 4.66, unit: kWh/m2/day, source: published, ref: "NASA POWER, as ghi_jan"}
  ghi_aug: {value: 5.18, unit: kWh/m2/day, source: published, ref: "NASA POWER, as ghi_jan"}
  ghi_sep: {value: 6.07, unit: kWh/m2/day, source: published, ref: "NASA POWER, as ghi_jan"}
  ghi_oct: {value: 6.20, unit: kWh/m2/day, source: published, ref: "NASA POWER, as ghi_jan"}
  ghi_nov: {value: 5.82, unit: kWh/m2/day, source: published, ref: "NASA POWER, as ghi_jan"}
  ghi_dec: {value: 5.95, unit: kWh/m2/day, source: published, ref: "NASA POWER, as ghi_jan"}
node:
  health_every_s: {value: 900, unit: s, source: estimate, ref: "spec §9.3: health report every 15 min, configurable"}
environment:
  ambient_min_c: {value: 14, unit: °C, source: estimate, ref: "Arusha night-time low, typical"}
  ambient_max_c: {value: 27, unit: °C, source: estimate, ref: "Arusha afternoon high, typical (peak 15:00)"}
  sun_gain_c: {value: 20, unit: °C, source: estimate, ref: "extra heat in a sealed relay enclosure in full sun (spec §11.5); measure in H1"}
